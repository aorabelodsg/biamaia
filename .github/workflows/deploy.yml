# Publica o site na Locaweb via FTP a cada envio para a branch main,
# usando a action oficial da Locaweb (painel > Publicar via Git).
# Requer os segredos FTP_SERVER, FTP_USERNAME e FTP_PASSWORD
# (GitHub > Settings > Secrets and variables > Actions).
name: Deploy na Locaweb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP Deploy Locaweb
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: "."
          remoteDir: "public_html"
          options: "-x ^\\.github/ -x ^README\\.md$"
